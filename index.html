<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regras e Aceite de Entrada | Comunidade</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 580px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 6px;
      text-align: center;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.4;
    }

    .card-regras {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-regras h3 {
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    .card-regras p {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .card-regras p strong {
      color: #e2e8f0;
    }

    label.check-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 500;
      color: #f1f5f9;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    label.check-label input {
      margin-top: 2px;
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 12px;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    input[type="text"] {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      color: var(--text);
      font-size: 1rem;
      text-align: center;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

      background-color
